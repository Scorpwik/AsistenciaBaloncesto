<!-- index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1d428a">
    <meta name="description" content="Control de asistencia de baloncesto">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Basket Tracker">
    <title>Basket Tracker</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="styles.css?v=pwa">
    
</head>
<body>

    <header>
        <div class="header-top">
            <h1 id="headerTitle">Asistencia</h1>
            <a href="https://docs.google.com/spreadsheets/d/16SuyK8LmXLYJfqAMS8OEnhvwTKsm5GHer03NZbyPsCs/edit?usp=sharing" target="_blank" class="btn-excel">Ir a hoja de Excel</a>
        </div>
        <div class="controls">
            <div class="custom-dropdown" id="customDropdown">
                <button type="button" class="dropdown-trigger" id="dropdownTrigger">
                    <span id="selectedParaleloText">Cargando...</span>
                    <span class="arrow">▼</span>
                </button>
                <div class="dropdown-menu" id="dropdownMenu"></div>
            </div>
            <input type="text" id="fechaInput" placeholder="Seleccionar fecha" readonly>
        </div>
    </header>

    <div class="legend-bar" id="legendBar">
        <div class="legend-item"><span class="dot p"></span> P: Presente</div>
        <div class="legend-item"><span class="dot f"></span> F: Falta</div>
        <div class="legend-item"><span class="dot a"></span> A: Atraso</div>
    </div>

    <main>
        <section id="panel-asistencia" class="panel active">
            <button class="btn-global" id="marcarTodosBtn">Marcar todos Presentes</button>
            <div id="asistenciaList"></div>
        </section>

        <section id="panel-editor" class="panel">
            <div id="editorSchedulesView">
                <form class="horario-create" id="formNewHorario">
                    <label class="visually-hidden" for="newHorarioName">Nombre del nuevo horario</label>
                    <input type="text" id="newHorarioName" placeholder="Nuevo horario, ej. 17:00 Lunes" autocomplete="off">
                    <button type="submit" class="btn-add" id="btnAddHorario">Crear</button>
                </form>
                <div id="horariosList"></div>
            </div>

            <div id="editorStudentsView" hidden>
                <div class="editor-students-head">
                    <button type="button" class="btn-back" id="btnBackHorarios">← Horarios</button>
                    <h2 id="editorHorarioTitle">Estudiantes</h2>
                </div>
                <div class="editor-search-wrap">
                    <label class="visually-hidden" for="studentSearch">Buscar estudiante</label>
                    <input type="search" id="studentSearch" placeholder="Buscar por nombre o código..." autocomplete="off">
                </div>
                <form class="add-student-container" id="formAddStudent">
                    <label class="visually-hidden" for="newStudentBanner">Código Banner</label>
                    <input type="text" id="newStudentBanner" placeholder="Código Banner" autocomplete="off">
                    <label class="visually-hidden" for="newStudentName">Nombre del alumno</label>
                    <input type="text" id="newStudentName" placeholder="Nombre del alumno..." autocomplete="off">
                    <button type="submit" class="btn-add" id="btnAddStudent">Agregar</button>
                </form>
                <div id="editorList"></div>
            </div>
        </section>

        <section id="panel-historial" class="panel">
            <p class="historial-context" id="historialContext"></p>
            <div class="editor-search-wrap">
                <label class="visually-hidden" for="historialSearch">Buscar en historial</label>
                <input type="search" id="historialSearch" placeholder="Buscar alumno o fecha..." autocomplete="off">
            </div>
            <p class="historial-hint" id="historialHint" hidden></p>
            <button class="btn-global" id="btnFetchHistory">Actualizar historial</button>
            <div id="historialList"></div>
            <div id="historialActionContainer" hidden>
                <button class="btn-save-edit" id="btnSaveHistoryEdits">Guardar cambios de este día</button>
            </div>
        </section>
    </main>

    <div class="fab-container">
        <button class="fab visible" id="guardarBtn">Guardar Asistencia</button>
    </div>

    <nav class="bottom-nav-wrapper">
        <div class="bottom-nav-pill">
            <div class="nav-item active" data-target="panel-asistencia" role="button" tabindex="0">
                <span class="nav-text">Asistencia</span>
            </div>
            <div class="nav-item" data-target="panel-editor" role="button" tabindex="0">
                <span class="nav-text">Editor</span>
            </div>
            <div class="nav-item" data-target="panel-historial" role="button" tabindex="0">
                <span class="nav-text">Historial</span>
            </div>
        </div>
    </nav>

    <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

    <div class="overlay" id="loaderOverlay">
        <div class="spinner" id="spinner"></div>
        <div class="modal" id="customModal">
            <h2 id="modalTitle">Atención</h2>
            <p id="modalText">Mensaje del sistema</p>
            <div class="modal-buttons" id="modalButtons">
                <button id="modalPrimaryBtn" class="modal-btn primary">Aceptar</button>
                <button id="modalSecondaryBtn" class="modal-btn secondary" style="display: none;">Cancelar</button>
            </div>
        </div>
    </div>
    

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
    <script src="app.js"></script>
</body>
</html>
