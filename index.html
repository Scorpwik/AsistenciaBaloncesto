<!-- index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Basket Tracker - App Completa</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="header-top">
            <h1 id="headerTitle">🏀 Asistencia</h1>
        </div>
        <div class="controls">
            <select id="paraleloSelect">
                <option value="Paralelo A">Paralelo A</option>
                <option value="Lu/Mi 16:00">Lu/Mi 16:00</option>
            </select>
            <input type="date" id="fechaInput">
        </div>
    </header>

    <div class="legend-bar" id="legendBar">
        <div class="legend-item"><span class="dot p"></span> P: Presente</div>
        <div class="legend-item"><span class="dot f"></span> F: Falta</div>
        <div class="legend-item"><span class="dot a"></span> A: Atraso</div>
    </div>

    <main>
        <!-- PANEL 1: ASISTENCIA -->
        <section id="panel-asistencia" class="panel active">
            <button class="btn-global" id="marcarTodosBtn">✓ Marcar todos P (Presentes)</button>
            <div id="asistenciaList"></div>
        </section>

        <!-- PANEL 2: EDITOR DE ESTUDIANTES -->
        <section id="panel-editor" class="panel">
            <div class="add-student-container">
                <input type="text" id="newStudentName" placeholder="Nombre del nuevo alumno...">
                <button class="btn-add" id="btnAddStudent">➕ Agregar</button>
            </div>
            <div id="editorList"></div>
        </section>

        <!-- PANEL 3: HISTORIAL -->
        <section id="panel-historial" class="panel">
            <button class="btn-global" id="btnFetchHistory" style="color:var(--dark);">📅 Cargar Historial de esta Fecha</button>
            <div id="historialList" style="padding: 15px; text-align: center; color: #666;">
                Selecciona una fecha y presiona "Cargar Historial"
            </div>
        </section>
    </main>

    <div class="fab-container">
        <button class="fab visible" id="guardarBtn">Guardar Asistencia</button>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" data-target="panel-asistencia">
            <span class="nav-icon">📝</span>
            <span>Asistencia</span>
        </div>
        <div class="nav-item" data-target="panel-editor">
            <span class="nav-icon">👥</span>
            <span>Editor</span>
        </div>
        <div class="nav-item" data-target="panel-historial">
            <span class="nav-icon">📅</span>
            <span>Historial</span>
        </div>
    </nav>

    <div class="overlay" id="loaderOverlay">
        <div class="spinner" id="spinner"></div>
        <div class="modal" id="successModal">
            <h2 id="modalTitle" style="color: var(--primary);">¡Completado!</h2>
            <p id="modalText">Acción realizada con éxito.</p>
            <button id="cerrarModalBtn">Aceptar</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
