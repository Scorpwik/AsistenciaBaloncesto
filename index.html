<!-- index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Basket Tracker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="header-top">
            <h1 id="headerTitle">Asistencia</h1>
        </div>
        <div class="controls">
            <div class="custom-dropdown" id="customDropdown">
                <button type="button" class="dropdown-trigger" id="dropdownTrigger">
                    <span id="selectedParaleloText">Cargando...</span>
                    <span class="arrow">▼</span>
                </button>
                <div class="dropdown-menu" id="dropdownMenu"></div>
            </div>
            <input type="text" id="fechaInput" placeholder="Seleccionar fecha" readonly>
        </div>
    </header>

    <div class="legend-bar" id="legendBar">
        <div class="legend-item"><span class="dot p"></span> P: Presente</div>
        <div class="legend-item"><span class="dot f"></span> F: Falta</div>
        <div class="legend-item"><span class="dot a"></span> A: Atraso</div>
    </div>

    <main>
        <section id="panel-asistencia" class="panel active">
            <button class="btn-global" id="marcarTodosBtn">Marcar todos Presentes</button>
            <div id="asistenciaList"></div>
        </section>

        <section id="panel-editor" class="panel">
            <div class="add-student-container">
                <input type="text" id="newStudentName" placeholder="Nombre del nuevo alumno...">
                <button class="btn-add" id="btnAddStudent">Agregar</button>
            </div>
            <div id="editorList"></div>
        </section>

        <section id="panel-historial" class="panel">
            <button class="btn-global" id="btnFetchHistory">Cargar Historial de esta Fecha</button>
            <div id="historialList" class="empty-state">
                Selecciona una fecha y presiona Cargar Historial
            </div>
            <div id="historialActionContainer" style="padding: 15px; display: none;">
                <button class="btn-save-edit" id="btnSaveHistoryEdits" style="width: 100%; padding: 14px; font-size: 0.95rem;">Guardar Cambios en Historial</button>
            </div>
        </section>
    </main>

    <div class="fab-container">
        <button class="fab visible" id="guardarBtn">Guardar Asistencia</button>
    </div>

    <nav class="bottom-nav-wrapper">
        <div class="bottom-nav-pill">
            <div class="nav-item active" data-target="panel-asistencia">
                <span class="nav-text">Asistencia</span>
            </div>
            <div class="nav-item" data-target="panel-editor">
                <span class="nav-text">Editor</span>
            </div>
            <div class="nav-item" data-target="panel-historial">
                <span class="nav-text">Historial</span>
            </div>
        </div>
    </nav>

    <div class="overlay" id="loaderOverlay">
        <div class="spinner" id="spinner"></div>
        <div class="modal" id="customModal">
            <h2 id="modalTitle">Atención</h2>
            <p id="modalText">Mensaje del sistema</p>
            <div class="modal-buttons" id="modalButtons">
                <button id="modalPrimaryBtn" class="modal-btn primary">Aceptar</button>
                <button id="modalSecondaryBtn" class="modal-btn secondary" style="display: none;">Cancelar</button>
            </div>
        </div>
    </div>
    <div class="header-top">
        <h1 id="headerTitle">Asistencia</h1>
        <a href="https://docs.google.com/spreadsheets/d/16SuyK8LmXLYJfqAMS8OEnhvwTKsm5GHer03NZbyPsCs/edit?usp=sharing" target="_blank" class="btn-excel">Ir a hoja de Excel</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
    <script src="app.js"></script>
</body>
</html>
